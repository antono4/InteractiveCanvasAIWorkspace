<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan Web — work-2</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #e2e8f0; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 60%);
             color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: var(--card); border: 1px solid #334155; border-radius: 16px;
              padding: 3rem 2.5rem; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .badge { display: inline-block; background: rgba(56,189,248,.12); color: var(--accent);
               border: 1px solid rgba(56,189,248,.35); border-radius: 999px;
               padding: .3rem .8rem; font-size: .78rem; font-weight: 600; letter-spacing: .04em; margin-bottom: 1.2rem; }
    h1 { font-size: 1.7rem; margin-bottom: .6rem; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
    .status { display: flex; align-items: center; gap: .55rem; font-size: .92rem; margin-top: 1.4rem;
               padding-top: 1.2rem; border-top: 1px solid #334155; }
    .dot { width: 10px; height:  10px; border-radius: 50%; background: #22c55e;
             box-shadow: 0 0 12px rgba(34,197,94,.7)); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    code { background: #0f172a; padding: .15rem .4rem; border-radius: 6px; font-size: .85em; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">● Layanan aktif</span>
    <h1>Halo dari work‑2!</h1>
    <p>Aplikasi web di <code>https://work-2-<b>wxniqlsnuptzpymt</b>.prod-runtime.all-hands.dev/</code> sekarang berjalan normal. Server ini melayani port <code>12001</code> (WORKER_2).</p>
    <p><a href="/health" style="color:var(--accent);">Cek kesehatan</a> · <a href="/status" style="color:var(--accent);">Status server</a></p>
    <div class="status"><span class="dot"></span><span>Semua sistem beroperasi — HTTP 200 OK</span></div>
  </div>
</body>
</html>
